[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ast-scope-variable-tracker"
version = "0.1.0"
description = "Python AST analyzer tracing symbol lifetimes and variable bindings across agent-generated code snippets to flag undefined references before execution"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
ast-scope-variable-tracker = "ast_scope_variable_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ast_scope_variable_tracker*"]
